<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Votacion de Peliculas</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="encabezado">
        <h1>Vote for your favorite film!</h1>
    </header>

    <main>
        <div class="contenedor1">
            <input type="text" placeholder="Write a cool title..." class="ingreso">
            <button class="botonAgregar">Add</button>
        </div>

        <div class="containerTopFilm">
            <p id="topFilm">The #1 Film is: None</p>
        </div>

        <div class="contenedor2">
            <div class="contenedor-cartas">
                <div class="cuandoNoHayPeliculas">
                    <p>There's no Films on our List</p>
                </div>

            </div>
        </div>
    </main>

    <script src="./app.js"></script>
</body>

</html>
